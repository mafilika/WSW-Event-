<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>WSW Event Ticket Check-In</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="app">

    <section class="card">

      <div class="header">

        <div class="logo">WSW</div>

        <div>
          <h1>Event Check-In</h1>

          <p>
            Enter or scan a ticket number
          </p>
        </div>

      </div>


      <!-- Ticket search -->

      <div class="search-area">

        <label for="ticketNumber">
          Ticket Number
        </label>

        <input
          id="ticketNumber"
          type="text"
          placeholder="Example: WSW26-001"
          autocomplete="off"
        >

        <button id="verifyButton">

          Verify Ticket

        </button>

      </div>


      <!-- Loading message -->

      <div
        id="loading"
        class="loading hidden"
      >

        Searching Firebase...

      </div>


      <!-- Ticket result -->

      <section
        id="result"
        class="result hidden"
      >

        <div
          id="statusBox"
          class="status-box"
        >
        </div>


        <div class="ticket-details">

          <div class="detail">

            <span>Event</span>

            <strong id="eventName">
              —
            </strong>

          </div>


          <div class="detail">

            <span>Ticket Number</span>

            <strong id="ticketId">
              —
            </strong>

          </div>


          <div class="detail">

            <span>Guest Name</span>

            <strong id="guestName">
              —
            </strong>

          </div>


          <div class="detail">

            <span>Ticket Type</span>

            <strong id="ticketType">
              —
            </strong>

          </div>


          <div class="detail">

            <span>Check-In Time</span>

            <strong id="checkInTime">
              Not checked in
            </strong>

          </div>

        </div>


        <button
          id="checkInButton"
          class="check-in-button"
        >

          ✓ CHECK IN GUEST

        </button>

      </section>


      <!-- Error -->

      <div
        id="message"
        class="message hidden"
      >
      </div>

    </section>

  </main>


  <script type="module" src="app.js"></script>

</body>
</html>
